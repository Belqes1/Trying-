<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المعرض الفني - أهلاً بكم</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; background-color: #f7f4ef; padding: 20px; color: #4a3b32; }
    .card { background: #ffffff; padding: 30px 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(74, 59, 50, 0.08); max-width: 380px; margin: 40px auto; border: 1px solid #e8dfd8; }
    .logo { width: 120px; height: auto; margin-bottom: 15px; border-radius: 8px; }
    h1 { color: #3d2e24; font-size: 22px; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.6; color: #6e5a4e; }
    .status { margin-top: 20px; font-weight: bold; color: #8c6d58; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="اللوجو" class="logo">
    <h1>مرحباً بكم في المعرض الفني 🎨</h1>
    <p>تم تحميل محتوى المعرض والصوتيات بنجاح على جهازك.</p>
    <p>يمكنك الآن التنقل بين اللوحات ومسح الباركود الخاص بكل لوحة للاستماع إلى الشرح الصوتي حتى بدون اتصال بالإنترنت!</p>
    <div id="status" class="status">جاري تجهيز الملفات للعمل بدون إنترنت...</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => {
          document.getElementById('status').innerText = '✅ المعرض جاهز للعمل بدون إنترنت!';
        })
        .catch(() => {
          document.getElementById('status').innerText = '⚠️ اكتمل التحضير.';
        });
    }
  </script>
</body>
</html>
