<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    </audio>

    <!-- 3. أسماء الفريق -->
    <div class="team">
      <p><b>فريق العمل:</b></p
أ. رهف السناني| موده روشن|</p>
</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
